---
- name: Apply CloudWatch configuration
  ansible.builtin.command:
    argv:
      - /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
      - -a
      - fetch-config
      - -m
      - ec2
      - -s
      - -c
      - file:/opt/aws/amazon-cloudwatch-agent/etc/cloudwatch-agent.json
  changed_when: true
