---
- name: Hash the desired Caddy configuration independently of template changes
  ansible.builtin.stat:
    path: '{{ lago_project_path }}/caddy/Caddyfile'
    checksum_algorithm: sha256
  register: lago_caddy_config

- name: Check the last successfully applied Caddy configuration
  ansible.builtin.stat:
    path: '{{ lago_data_mount_path }}/.lago-caddy-applied'
  register: lago_caddy_marker

- name: Read the successful Caddy configuration checkpoint
  ansible.builtin.slurp:
    src: '{{ lago_data_mount_path }}/.lago-caddy-applied'
  register: lago_previous_caddy
  when: lago_caddy_marker.stat.exists

- name: Apply Caddy configuration until the exact file has been loaded successfully
  when: >-
    not lago_caddy_marker.stat.exists or
    (lago_previous_caddy.content | default('') | b64decode | trim) != lago_caddy_config.stat.checksum
  block:
    - name: Reload the running Caddy process and require its acknowledgement
      ansible.builtin.command:
        argv: [docker, compose, --project-name, '{{ lago_project_name }}', --file, compose.yml, exec, --no-TTY, caddy, caddy, reload, --config, /etc/caddy/Caddyfile, --force]
        chdir: '{{ lago_project_path }}'
      changed_when: true

    - name: Record Caddy configuration only after the reload succeeds
      ansible.builtin.copy:
        content: "{{ lago_caddy_config.stat.checksum }}\n"
        dest: '{{ lago_data_mount_path }}/.lago-caddy-applied'
        mode: '0600'
