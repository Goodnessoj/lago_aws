---
- ansible.builtin.import_playbook: verify-access.yml

- name: Bound the lab verification session
  hosts: lago
  become: true
  gather_facts: false
  tasks:
    - name: Arm the temporary stop timer before both configuration passes
      ansible.builtin.command:
        argv:
          - systemd-run
          - --unit=lago-session-stop
          - --on-active=45min
          - /usr/sbin/shutdown
          - -h
          - now
        creates: /run/systemd/transient/lago-session-stop.timer

- ansible.builtin.import_playbook: configure.yml
- ansible.builtin.import_playbook: configure.yml

- name: Stop the existing lab host after verification
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  tasks:
    - name: Stop the inventory instance without changing its retained resources
      amazon.aws.ec2_instance:
        region: us-east-2
        instance_ids: "{{ groups['lago'] }}"
        state: stopped
        wait: true
        wait_timeout: 600
