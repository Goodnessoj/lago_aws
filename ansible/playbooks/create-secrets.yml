---
- name: Create only missing application secrets outside Terraform
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    ansible_connection: local
    ansible_become: false
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
    lago_create_missing_secrets: false
    lago_generated_parameters:
      - {name: postgres_password, length: 64}
      - {name: secret_key_base, length: 128}
      - {name: encryption_primary_key, length: 32}
      - {name: encryption_deterministic_key, length: 32}
      - {name: encryption_key_derivation_salt, length: 32}
      - {name: initial_admin_password, length: 64}
  tasks:
    - name: Require explicit approval before generating or writing secrets
      ansible.builtin.assert:
        that: lago_create_missing_secrets | bool
        fail_msg: Review the target AWS identity and approve creation with lago_create_missing_secrets=true.

    - name: Read the intended runtime role from the deployed Terraform environment
      ansible.builtin.command:
        argv: [terraform, '-chdir={{ playbook_dir }}/../../terraform/environments/dev', output, -raw, instance_role_arn]
      register: lago_expected_runtime_role
      changed_when: false
      no_log: true

    - name: Read the current operator account
      ansible.builtin.command:
        argv: [aws, sts, get-caller-identity, --region, us-east-2, --query, Account, --output, text]
      register: lago_operator_account
      changed_when: false
      no_log: true

    - name: Require the operator and deployed environment to use the same AWS account
      ansible.builtin.assert:
        that:
          - lago_expected_runtime_role.stdout is match('^arn:aws:iam::[0-9]{12}:role/')
          - lago_expected_runtime_role.stdout.split(':')[4] == lago_operator_account.stdout
      no_log: true

    - name: Inspect existing parameter metadata without decrypting values
      ansible.builtin.command:
        argv: [aws, ssm, describe-parameters, --region, us-east-2, --parameter-filters, 'Key=Name,Option=BeginsWith,Values=/lago/dev/', --output, json]
      environment:
        AWS_PAGER: ''
      register: lago_existing_parameters
      changed_when: false

    - name: Refuse an existing non-SecureString application parameter
      ansible.builtin.assert:
        that: item.Type == 'SecureString'
        fail_msg: Existing parameters must be reviewed; this playbook never replaces them.
        quiet: true
      loop: '{{ (lago_existing_parameters.stdout | from_json).Parameters }}'
      loop_control:
        label: '{{ item.Name }}'
      when: item.Name | basename in ((lago_generated_parameters | map(attribute='name') | list) + ['rsa_private_key'])

    - name: Create missing random SecureStrings without overwriting existing keys
      community.aws.ssm_parameter:
        region: us-east-2
        name: '/lago/dev/{{ item.name }}'
        string_type: SecureString
        tier: Standard
        overwrite_value: never
        decryption: false
        value: "{{ lookup('ansible.builtin.password', '/dev/null', length=item.length, chars=['0123456789abcdef']) }}"
      loop: '{{ lago_generated_parameters }}'
      when: ('/lago/dev/' + item.name) not in ((lago_existing_parameters.stdout | from_json).Parameters | map(attribute='Name') | list)
      no_log: true
      diff: false

    - name: Generate the RSA signing key only when its parameter is missing
      when: "'/lago/dev/rsa_private_key' not in ((lago_existing_parameters.stdout | from_json).Parameters | map(attribute='Name') | list)"
      no_log: true
      block:
        - name: Generate a private RSA key in memory
          ansible.builtin.command:
            argv: [openssl, genrsa, '3072']
          register: lago_new_rsa_key

        - name: Store the base64-encoded RSA key without overwriting an existing key
          community.aws.ssm_parameter:
            region: us-east-2
            name: /lago/dev/rsa_private_key
            string_type: SecureString
            tier: Standard
            overwrite_value: never
            decryption: false
            value: '{{ lago_new_rsa_key.stdout | b64encode }}'
