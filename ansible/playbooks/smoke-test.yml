---
- name: Test Docker execution and configured container logging
  hosts: lago
  become: true
  gather_facts: false
  tasks:
    - name: Run the digest-pinned official hello-world image without published ports
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --name
          - lago-host-smoke
          - --network
          - none
          - --read-only
          - --cap-drop
          - ALL
          - --security-opt
          - no-new-privileges
          - 'hello-world@sha256:d1a8d0a4eeb63aff09f5f34d4d80505e0ba81905f36158cc3970d8e07179e59e'
      register: lago_runtime_smoke
      changed_when: true
      failed_when: lago_runtime_smoke.rc != 0 or 'Hello from Docker!' not in lago_runtime_smoke.stdout
